# Preparação somente. Importar um Blueprint na Render pode iniciar um deploy.
# O modo local foi preservado deliberadamente; não importar antes da homologação.
services:
  - type: web
    name: corretor-gabaritos-v2-api
    runtime: python
    branch: feature/deploy-vercel-render
    rootDir: Backend
    plan: 1c-2g
    autoDeployTrigger: "off"
    buildCommand: >-
      python -m pip install --only-binary=:all: -r requirements.txt &&
      python -m pip check &&
      python scripts/verificar_runtime.py
    startCommand: >-
      python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --no-proxy-headers --workers 1
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_AMBIENTE
        value: local
      - key: SERVIR_FRONTEND
        value: "false"
      - key: FIRESTORE_MODO
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: INTEGRIDADE_CHAVE
        sync: false
