# Preparação somente. Importar um Blueprint na Render pode iniciar um deploy.
# Modo público compartilhado: exige projeto Firestore dedicado e segredos manuais.
services:
  - type: web
    name: corretor-gabaritos-v2-api
    runtime: python
    branch: main
    rootDir: Backend
    plan: 1c-2g
    autoDeployTrigger: "off"
    buildCommand: >-
      python -m pip install --only-binary=:all: -r requirements.txt &&
      python -m pip check &&
      python scripts/verificar_runtime.py
    startCommand: >-
      python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --no-proxy-headers --workers 1
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_AMBIENTE
        value: publico_compartilhado
      - key: SERVIR_FRONTEND
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FIRESTORE_MODO
        value: real
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRODUCTION_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firestore-publico.json
      - key: INTEGRIDADE_CHAVE
        sync: false
      - key: LOTE_ZIP_MAX_MIB
        value: "8"
      - key: LOTE_MAX_IMAGENS
        value: "20"
      - key: LOTE_TOTAL_MAX_MIB
        value: "50"
      - key: LOTE_PDF_MAX_PAGINAS
        value: "10"
