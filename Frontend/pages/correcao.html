<template data-slot="correction-fields">
  <div id="correction-fields" hidden>
    <section class="card setup-card">
      <span class="step">01</span>
      <div class="grow">
        <label for="evaluation-select">Avaliação cadastrada</label
        ><select id="evaluation-select">
          <option value="">Selecione uma avaliação</option>
        </select>
      </div>
      <div class="grow">
        <label for="student-name">Nome do aluno</label
        ><input
          id="student-name"
          maxlength="200"
          placeholder="Capture o cartão ou digite o nome"
          autocomplete="off"
          aria-describedby="student-name-status"
        />
        <p id="student-name-status" class="helper" role="status">
          O nome será sugerido após a captura. Você também pode digitá-lo.
        </p>
      </div>
      <div id="recovery-panel" class="grow" hidden>
        <h3>Correções aguardando confirmação</h3>
        <p class="helper">Consulte cada operação antes de reenviar. Nenhuma imagem é guardada.</p>
        <div id="recovery-list"></div>
      </div>
    </section>
  </div>
</template>

<template data-slot="event-panels">
  <div id="event-panels">
    <section id="export-panel" class="card operation-panel" hidden>
      <h3>Exportação e conferência do evento</h3>
      <label for="export-evaluation">Resultados</label>
      <select id="export-evaluation">
        <option value="">Todas as avaliações</option>
      </select>
      <button id="export-results" class="secondary" type="button">Baixar correções em CSV</button>
      <button id="export-summary-download" class="secondary" type="button" disabled>Baixar resumo de conferência</button>
      <p id="export-status" class="helper" role="status"></p>
    </section>
    <section id="batch-panel" class="card operation-panel" hidden>
      <h3>Importar lote ZIP</h3>
      <p class="helper">Somente no computador operacional. PDF, JPG ou PNG; até 100 páginas/imagens por lote. Cada página PDF é um gabarito separado. Revise e salve individualmente.</p>
      <label class="file-button" for="batch-file">Selecionar ZIP</label>
      <input id="batch-file" type="file" accept=".zip,application/zip" />
      <div class="batch-actions">
        <button id="batch-next" class="secondary" type="button" disabled>Carregar próxima imagem</button>
        <button id="batch-pause" class="secondary" type="button" disabled>Pausar</button>
        <button id="batch-cancel" class="secondary" type="button" disabled>Cancelar lote</button>
      </div>
      <p id="batch-current" class="helper" role="status"></p>
      <p id="batch-summary" class="helper" role="status"></p>
      <div id="batch-errors" class="helper"></div>
    </section>
  </div>
</template>

<template data-slot="student-link-panel">
  <section id="student-link-panel" class="card student-link-panel" hidden>
    <div class="grow">
      <label for="student-link-select"
        >Homônimos: confirme o cadastro, se necessário</label
      ><select id="student-link-select">
        <option value="">Digite ou reconheça o nome para procurar</option>
      </select>
      <p id="student-link-status" class="helper" role="status">
        O aluno será cadastrado ou reutilizado somente ao confirmar o salvamento
        da correção.
      </p>
    </div>
    <label id="student-homonym-label" class="check" hidden
      ><input id="student-new-homonym" type="checkbox" />Confirmo que é outra
      pessoa com o mesmo nome. Criar um cadastro separado somente ao
      salvar.</label
    >
  </section>
</template>

<template data-slot="result-panel">
  <section id="result-panel" class="card review-card" hidden>
    <div class="card-heading">
      <div>
        <p class="eyebrow">03 · CONFERÊNCIA</p>
        <h2>Resultado da correção</h2>
      </div>
      <span id="result-state" class="tag">Aguardando leitura</span>
    </div>
    <div id="result-empty" class="empty-state">
      <h3>Pronto para conferir</h3>
      <p>
        Selecione uma avaliação, informe o aluno<br />e envie o cartão para
        visualizar o resultado.
      </p>
    </div>
    <div id="result-content" hidden>
      <div class="score">
        <span id="total-score">—</span>
        <div>pontos de 50<strong id="total-percent"></strong></div>
      </div>
      <div id="result-counts" class="counts"></div>
      <div id="discipline-results"></div>
      <p id="pending-list" class="helper"></p>
      <label class="check"
        ><input id="confirm-result" type="checkbox" />Conferi o aluno, a
        avaliação e o resultado desta correção.</label
      ><label id="provisional-label" class="check" hidden
        ><input id="allow-provisional" type="checkbox" />Quero salvar este
        resultado provisório, com pendências.</label
      ><button id="save-result" class="primary wide" disabled>
        Salvar correção
      </button>
      <p id="saved-result" class="helper" hidden></p>
    </div>
  </section>
</template>

<template data-slot="visual-panel">
  <section id="visual-panel" class="card list-card" hidden>
    <div class="card-heading">
      <h2>Cartão corrigido</h2>
      <span class="tag">Conferência visual</span>
    </div>
    <p class="annotation-legend">
      <span class="correct">+ Correta</span
      ><span class="incorrect">× Incorreta</span
      ><span class="pending">? Pendente</span
      ><span class="blank">– Em branco</span>
    </p>
    <p id="visual-status" class="helper" role="status"></p>
    <div class="visual-layout">
      <div class="annotated-image">
        <canvas
          id="annotated-card"
          role="img"
          aria-label="Cartão com questões numeradas e cores de conferência"
        ></canvas>
      </div>
      <div>
        <h3>Conferência das respostas</h3>
        <p class="helper">
          Uma alteração manual recalcula a nota e as cores. Confirme novamente
          antes de salvar.
        </p>
        <div id="student-answer-grid" class="answer-grid"></div>
      </div>
    </div>
  </section>
</template>
